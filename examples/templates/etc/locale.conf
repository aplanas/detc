{#-
  The language of the node, out of `locale.*`.

  This is not part of the core set and is not installed.  `/etc/locale.conf`
  has no drop-in directory, so the whole file is the template: the first locale
  that is set replaces the one the installer wrote, and unsetting them all
  takes the file away rather than giving that one back.

  Unlike `etc/hostname`, both variables here are optional and a file with only
  `LC_TIME` in it is a real thing to want, so this writes what it was given and
  nothing when it was given nothing.  That is exactly the case that makes it an
  example: a rendering with nothing in it writes no file, which leaves the
  installer's file alone on a node that never set a locale, and takes away the
  one detc wrote on a node that set one and then stopped.  A fleet that copies
  this either always sets `locale.lang`, or accepts that.

  The locale has to be generated before it can be used.  On a distribution that
  builds them, `glibc-locale` or the `locale-gen` step is the fleet's job.
-#}
{% if locale.lang is defined %}LANG={{ locale.lang }}
{% endif -%}
{% if locale.lc_time is defined %}LC_TIME={{ locale.lc_time }}
{% endif -%}
