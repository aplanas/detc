{#-
  The drop-in of the worked `_requires` example.

  This is not part of the core set and is not installed.  Copy it, along with
  `examples/resources/pkg/nginx` and `examples/resources/unit/nginx`, into a
  tree of your own; the header of the unit is where the argument for the three
  of them is.

    web:
      listen: 8080
      root: /srv/www/htdocs

  `conf.d` is nginx's own drop-in directory and is created by the package, so
  this template writes into a directory that `pkg/nginx` at order 10 has
  already put there.  That is the whole reason the package is required and not
  merely ordered first: without the package the write fails, and without the
  requirement the unit is restarted for a file that is not there.

  A directory that the *package* does not own is a `path` resource with
  `_order: 10` -- see `providers/path`, which says when to reach for that.
-#}
# Written by detc.  Do not edit: it is rewritten on every run.
server {
	listen {{ web.listen | default(80) }};
	root {{ web.root | default('/srv/www/htdocs') }};
}
