{#-
  The keyboard and font of the text console, out of `console.*`.

  This is not part of the core set and is not installed, for the same reason as
  `etc/locale.conf`: no drop-in directory, so the whole file is the template
  and a node that sets neither variable gets the file emptied.

  This is the one that is worth getting right before the first reboot of a
  machine that is only ever reached over a serial console or an out-of-band
  card, because a keymap nobody can type on is indistinguishable from a machine
  that did not come back.
-#}
{% if console.keymap is defined %}KEYMAP={{ console.keymap }}
{% endif -%}
{% if console.font is defined %}FONT={{ console.font }}
{% endif -%}
