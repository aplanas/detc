# Written by detc.  Do not edit: it is rewritten from
# usr/share/detc/templates.d/etc/chrony.d/60-detc.conf on every run.
#
# One `server` line per entry of `time.servers`, with `iburst` so that a node
# that has just booted reaches the right time in seconds rather than minutes:
#
#   time:
#     servers:
#       - 0.opensuse.pool.ntp.org
#       - 1.opensuse.pool.ntp.org
#
# An empty list writes only this comment, and chrony keeps whichever servers
# the distribution's own `chrony.conf` names.  These are added to those rather
# than replacing them: a fleet that wants only its own has to say so in its own
# drop-in, because there is no directive here that takes a server away.
{% for server in time.servers %}server {{ server }} iburst
{% endfor -%}
