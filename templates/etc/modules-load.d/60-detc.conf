# Written by detc.  Do not edit: it is rewritten from
# usr/share/detc/templates.d/etc/modules-load.d/60-detc.conf on every run.
#
# One module name per line, out of the `modules` list.  An empty list writes
# only this comment, and nothing is loaded that was not being loaded before.
#
#   modules:
#     - br_netfilter
#     - overlay
#
# These are loaded at the next boot.  The core resource
# `unit/systemd-modules-load` carries the digest of this file, so a module
# added here is loaded in the same run that added it.
{% for module in modules %}{{ module }}
{% endfor -%}
