# Written by detc.  Do not edit: it is rewritten from
# usr/share/detc/templates.d/etc/security/limits.d/60-detc.conf on every run.
#
# One line per entry of the `limits` list, in the order it was given, because
# pam_limits reads the first line that matches and order is meaning here:
#
#   limits:
#     - {domain: "@users", type: hard, item: nofile, value: 4096}
#     - {domain: "*",      type: soft, item: nofile, value: 1024}
#
# `domain` is a user, a `@group`, a `%group` for a per-group total, or `*`;
# `type` is `soft`, `hard` or `-`; `item` is what pam_limits calls it, such as
# `nofile`, `nproc` or `memlock`.  An empty list writes only this comment.
#
# These apply to a session as it is opened, so an account already logged in
# keeps what it was given until it logs in again.  Nothing detc can do about
# that, and nothing to restart either.
{% for limit in limits %}{{ limit.domain }} {{ limit.type }} {{ limit.item }} {{ limit.value }}
{% endfor -%}
