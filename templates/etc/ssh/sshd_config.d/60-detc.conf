# Written by detc.  Do not edit: it is rewritten from
# usr/share/detc/templates.d/etc/ssh/sshd_config.d/60-detc.conf on every run.
#
# Every directive below is here because a variable was set.  One nobody set
# writes no line at all, so sshd keeps what the distribution's own
# configuration says, and installing detc changes nothing.
#
# `is defined` and not `is not none` is the test, because a variable set to
# null is taken away rather than held as a null -- which is the whole of how a
# drop-in unsets what the document before it left.
#
# The values are written the way sshd wants them, which for the two that read
# as booleans means the strings `yes` and `no`.
{% if ssh.permit_root_login is defined %}PermitRootLogin {{ ssh.permit_root_login }}
{% endif -%}
{% if ssh.password_authentication is defined %}PasswordAuthentication {{ ssh.password_authentication }}
{% endif -%}
{% if ssh.x11_forwarding is defined %}X11Forwarding {{ ssh.x11_forwarding }}
{% endif -%}
{% if ssh.trusted_user_ca_keys is defined %}TrustedUserCAKeys {{ ssh.trusted_user_ca_keys }}
{% endif -%}
{% if ssh.host_certificate is defined %}HostCertificate {{ ssh.host_certificate }}
{% endif -%}
