# Written by detc.  Do not edit: it is rewritten from
# usr/share/detc/templates.d/etc/sysctl.d/60-detc.conf on every run.
#
# One line per entry of the `sysctl` map, in the order the names sort, so that
# the file only moves when what is in it moves.  An empty map writes only this
# comment, and the kernel is left as the distribution set it.
#
#   sysctl:
#     net.ipv4.ip_forward: 1
#     vm.swappiness: 10
#
# A sysctl written here takes effect at the next boot.  The core resource
# `unit/systemd-sysctl` carries the digest of this file, so a value that
# changed takes effect in the same run that changed it.
{% for name, value in sysctl | items %}{{ name }} = {{ value }}
{% endfor -%}
