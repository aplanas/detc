# Written by detc.  Do not edit: it is rewritten from
# usr/share/detc/templates.d/etc/systemd/journald.conf.d/60-detc.conf on every
# run.
#
# The section header is always written, because a systemd drop-in without one
# is a parse error rather than an empty opinion.  A section with nothing under
# it says nothing, which is what a node where neither variable was set wants.
#
# Restarting `systemd-journald` on a change is a fleet's decision and not the
# core's -- it is the one service whose restart takes the handles with it that
# everything logging through it holds.  A fleet that wants it declares:
{% raw %}#
#   # resources.d/unit/systemd-journald
#   config: "{{ detc.files['etc/systemd/journald.conf.d/60-detc.conf'] | default('') }}"
#   _order: 70
{% endraw -%}
[Journal]
{% if journald.storage is defined %}Storage={{ journald.storage }}
{% endif -%}
{% if journald.system_max_use is defined %}SystemMaxUse={{ journald.system_max_use }}
{% endif -%}
