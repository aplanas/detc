{% if logind -%}
# Written by detc.  Do not edit: it is rewritten from
# usr/share/detc/templates.d/etc/systemd/logind.conf.d/60-detc.conf on every
# run.
#
# The section header goes with the directives, because a systemd drop-in
# without one is a parse error.  A node where neither variable was set gets no
# file at all, header included.
#
# `systemd-logind` re-reads this on `systemctl reload systemd-logind`, and a
# restart of it ends every graphical session on the machine.  So the core does
# not touch it, and a fleet that wants the change to land before the next boot
# declares the unit itself, with `config` carrying the digest of this file.
[Login]
{% if logind.handle_power_key is defined %}HandlePowerKey={{ logind.handle_power_key }}
{% endif -%}
{% if logind.idle_action is defined %}IdleAction={{ logind.idle_action }}
{% endif -%}
{%- endif -%}
